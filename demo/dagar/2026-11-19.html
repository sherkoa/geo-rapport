function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);

  for (const k of kids) if (k != null) e.append(k);

}
function s(tag, attrs={}, text){

const tip = document.getElementById("tip");
function showTip(x, y, title, rows){
  tip.replaceChildren(el("b", {}, title));
  for (const r of rows){
    const line = el("div");
    if (r.color){ const i = el("i"); i.style.background = r.color; line.append(i); }
    line.append(r.text);
    tip.append(line);
  }
  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(x + 14, innerWidth - w - 4)) + "px";
  tip.style.top = Math.max(4, Math.min(y + 14, innerHeight - h - 4)) + "px";
}
const hideTip = () => tip.style.display = "none";
function hover(node, title, rows){
  node.setAttribute("tabindex", "0");
  node.addEventListener("mousemove", e => showTip(e.clientX, e.clientY, title, rows));
  node.addEventListener("mouseleave", hideTip);
  node.addEventListener("focus", () => { const b = node.getBoundingClientRect(); showTip(b.right, b.top, title, rows); });
  node.addEventListener("blur", hideTip);
}
function table(head, rows, numFrom=1){
  const t = el("table"), hr = el("tr");
  head.forEach((h,i) => hr.append(el("th", i >= numFrom ? {class:"num"} : {}, h)));
  t.append(el("thead", {}, hr));
  const body = el("tbody");
  for (const r of rows){
    const tr = el("tr");
    r.forEach((c,i) => tr.append(el("td", i >= numFrom ? {class:"num"} : {}, c == null ? "–" : String(c))));
    body.append(tr);
  }
  t.append(body);
  return el("div", {class:"scroll"}, t);
}

function kpi(label, key, fmt, factor, unit, lowerBetter, extra){
  const c = el("div", {class:"card kpi"}, el("div", {class:"label"}, label), el("div", {class:"value"}, fmt(T[key])));
  const d = el("div", {class:"delta"});
  if (D.igar && T[key] != null && D.igar[key] != null){

    if (Math.abs(diff) < 0.05) d.textContent = "● oförändrat mot " + M.foregaende;
    else {
      const good = lowerBetter ? diff < 0 : diff > 0;
      d.append(el("span", {class: good ? "up" : "down"}, `${diff > 0 ? "▲ +" : "▼ "}${nf(diff)}${unit} ${good ? "(bättre)" : "(sämre)"}`), ` mot ${M.foregaende}`);
    }
  } else d.textContent = "Ingen jämförelse ännu";
  c.append(d);
  if (extra) c.append(el("div", {class:"delta"}, extra));
  kpis.append(c);
}

function niceMax(v, cap){
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const m = [1,2,2.5,4,5,8,10].find(m => m*p >= v) * p;
  return cap ? Math.min(cap, m) : m;
}
function drawLines(host, title, series, fmt, opt){
  const W = Math.max(280, host.clientWidth), H = 220, L = 52, R = 12, Tp = 10, B = 26;
  const all = series.flatMap(se => se.values).filter(v => v != null);
  const svg = s("svg", {viewBox:`0 0 ${W} ${H}`, height:H, role:"img", "aria-label":title + ". Använd piltangenterna för att läsa av värden.", tabindex:"0"});
  host.replaceChildren(svg);
  if (!all.length){ svg.append(s("text", {x:W/2, y:H/2, "text-anchor":"middle"}, "Ingen data loggad")); return; }
  const lo = opt.invert ? 1 : 0;
  const hi = opt.invert ? Math.max(3, Math.ceil(Math.max(...all))) : (Math.max(...all) > 0 ? niceMax(Math.max(...all) * 1.05, opt.cap) : (opt.cap || 1));
  const n = trend.length;
  const x = i => n === 1 ? L + (W-L-R)/2 : L + i * (W-L-R) / (n-1);
  const y = v => { const f = (v-lo)/(hi-lo); return opt.invert ? Tp + f*(H-Tp-B) : H-B - f*(H-Tp-B); };
  for (let k=0; k<=4; k++){
    const v = lo + (hi-lo)*k/4;
    svg.append(s("line", {x1:L, x2:W-R, y1:y(v), y2:y(v), stroke:"var(--grid)", "stroke-width":1}));
    svg.append(s("text", {x:L-7, y:y(v)+4, "text-anchor":"end"}, opt.pct ? nf(v*100, Math.abs(v*100 - Math.round(v*100)) < 1e-6 ? 0 : 1)+" %" : nf(v, Number.isInteger(v) ? 0 : 1)));
  }
  const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W-L-R)/80))));
  for (let i=n-1; i>=0; i-=step) svg.append(s("text", {x:x(i), y:H-6, "text-anchor": n > 1 && i === n-1 ? "end" : "middle"}, trend[i].datum.slice(5)));
  const cross = s("line", {y1:Tp, y2:H-B, stroke:"var(--axis)", "stroke-width":1, visibility:"hidden"});
  svg.append(cross);
  for (const se of [...series].reverse()){
    let d = "", pen = false;
    se.values.forEach((v,i) => { if (v == null){ pen = false; return; } d += `${pen ? "L" : "M"}${x(i)},${y(v)}`; pen = true; });
    svg.append(s("path", {d, fill:"none", stroke:COLORS[se.name], "stroke-width": se.name === "Alla" ? 3 : 2, "stroke-linejoin":"round", "stroke-linecap":"round"}));
    se.values.forEach((v,i) => {
      if (v == null) return;
      const lone = se.values[i-1] == null && se.values[i+1] == null;
      if (i === n-1 || lone || n <= 10) svg.append(s("circle", {cx:x(i), cy:y(v), r:4, fill:COLORS[se.name], stroke:"var(--surface)", "stroke-width":2}));
    });
  }
  let cur = n-1;
  function show(i, cx, cy){
    cur = i; cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    showTip(cx, cy, trend[i].datum, series.map(se => ({color:COLORS[se.name], text:`${se.name}: ${fmt(se.values[i])}`})));
  }
  const hide = () => { cross.setAttribute("visibility","hidden"); hideTip(); };
  const hit = s("rect", {x:L-8, y:0, width:W-L-R+16, height:H, fill:"transparent"});
  hit.addEventListener("mousemove", e => {
    const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) * W / b.width;
    const i = n === 1 ? 0 : Math.max(0, Math.min(n-1, Math.round((px-L) / ((W-L-R)/(n-1)))));
    show(i, e.clientX, e.clientY);
  });
  hit.addEventListener("mouseleave", hide);
  svg.append(hit);
  const key = i => { const b = svg.getBoundingClientRect(); show(i, b.left + x(i)*b.width/W, b.top + 20); };
  svg.addEventListener("focus", () => key(cur));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight"){ e.preventDefault(); key(Math.max(0, Math.min(n-1, cur + (e.key === "ArrowLeft" ? -1 : 1)))); }
  });
}

    const top = max || Math.max(...items.map(i => i.value || 0), 0.000001);
    items.forEach((it,i) => {
      const w = (it.value || 0) / top * (W-L-R), y = i*row + 8, h = 18, r = Math.min(4, w/2);
      const g = s("g");
      g.append(s("rect", {x:0, y:i*row, width:W, height:row, fill:"transparent"}));
      g.append(s("text", {x:L-8, y:y+13, "text-anchor":"end", class:"cat"}, it.label));
      if (w > 0) g.append(s("path", {d:`M${L},${y}H${L+w-r}Q${L+w},${y} ${L+w},${y+r}V${y+h-r}Q${L+w},${y+h} ${L+w-r},${y+h}H${L}Z`, fill:it.color || "var(--s1)"}));

      svg.append(g);

    svg.append(s("line", {x1:L, x2:L, y1:2, y2:H-2, stroke:"var(--axis)"}));
    host.replaceChildren(svg);
  });
  return card;
}

const h2 = heat("exempelmyndigheten.example per område och tjänst", "Citeringsgrad i dagens mätning", services, areas.map(a => ({label:a.namn, values:services.map(t => a.tjanster[t])})));
h2.style.marginTop = "12px"; app.append(h2);

/* Innehållsanvändning */
app.append(el("h2", {}, "Innehållsanvändning"));
const g2 = el("div", {class:"grid two"}); app.append(g2);
const labels = {citat:"Citat", parafras:"Parafras", omnamnande:"Omnämnande", ingen:"Ingen"};
g2.append(bars("Hur innehållet används", `Antal svar, loggat för ${T.anvandningN} av ${T.n}`, Object.keys(labels).map(k => ({label:labels[k], value:T.typer[k]})), v => nf(v,0)));
const other = arr(D.andraDomaner);
g2.append(el("div", {class:"card"}, el("h3", {}, "Andra källor som citeras mest"), el("div", {class:"note"}, "Domäner utanför jämförelsegruppen"),
  other.length ? table(["Domän","Svar","Andel"], other.map(o => [o.doman, o.svar, pct(o.andel)])) : el("p", {class:"note"}, "Inga loggade.")));
const pages = arr(D.sidor);
const pageCard = el("div", {class:"card"}, el("h3", {}, "Mest citerade sidor på exempelmyndigheten.example"), el("div", {class:"note"}, "Högst 25 sidor, dagens mätning"));
if (pages.length){
  const tb = table(["Sida","Tjänster","Frågor","Svar"], pages.map(p => [p.sida, p.tjanster, p.fragor, p.svar]), 3);
  tb.querySelectorAll("tbody td:first-child").forEach(td => td.className = "url");
  pageCard.append(tb);
} else pageCard.append(el("p", {class:"note"}, "Inga citeringar av exempelmyndigheten.example loggade."));
pageCard.style.marginTop = "12px"; app.append(pageCard);

/* Frågor */
app.append(el("h2", {}, "Fråga för fråga"));
const qCard = el("div", {class:"card"}, el("div", {class:"note"}, "Klicka på en rubrik för att sortera. Svagast citeringsgrad visas först. M = medborgare, Y = yrkesverksam, ★ = bred grundfråga."));
const qCols = [
  ["Nr", q => q.nr, q => q.nr + (q.bred ? " ★" : ""), true],
  ["Fråga", q => q.fraga, q => q.fraga, false],
  ["Målgrupp", q => q.malgrupp, q => q.malgrupp, false],
  ["Svar", q => q.n, q => q.n, true],
  ["Citeringsgrad", q => q.citeringsgrad, q => pct(q.citeringsgrad), true],
  ["Förändring", q => q.fore == null ? null : q.citeringsgrad - q.fore, q => { if (q.fore == null) return "–"; const d = (q.citeringsgrad - q.fore)*100; return Math.abs(d) < 0.05 ? "● 0" : (d > 0 ? "▲ +" : "▼ ") + nf(d,0) + " p.e."; }, true],
  ["SOV", q => q.sov, q => pct(q.sov), true],
  ["Placering", q => q.placering, q => tal(q.placering), true],
  ["Användning", q => q.anvandning, q => pct(q.anvandning), true]
];
let sortCol = 4, asc = true;
const qWrap = el("div", {class:"scroll"}); qCard.append(qWrap); app.append(qCard);
function drawQ(){
  const t = el("table"), hr = el("tr");
  qCols.forEach((c,i) => {
    const th = el("th", {class:"sort" + (c[3] ? " num" : ""), tabindex:"0", "aria-sort": i === sortCol ? (asc ? "ascending" : "descending") : "none"}, c[0] + (i === sortCol ? (asc ? " ↑" : " ↓") : ""));
    const go = () => { asc = sortCol === i ? !asc : true; sortCol = i; drawQ(); };
    th.addEventListener("click", go); th.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    hr.append(th);
  });
  t.append(el("thead", {}, hr));
  const rows = [...arr(D.fragor)].sort((a,b) => {
    const x = qCols[sortCol][1](a), y = qCols[sortCol][1](b);
    if (x == null || y == null) return x == null ? (y == null ? 0 : 1) : -1;
    const r = typeof x === "string" ? x.localeCompare(y, "sv") : x - y;
    return r === 0 ? a.nr - b.nr : (asc ? r : -r);
  });
  const body = el("tbody");
  rows.forEach(q => { const tr = el("tr"); qCols.forEach(c => tr.append(el("td", c[3] ? {class:"num"} : {}, String(c[2](q))))); body.append(tr); });
  t.append(body); qWrap.replaceChildren(t);
}
drawQ();

/* Definitioner */
app.append(el("h2", {}, "Så räknas måtten"));
const dl = el("dl");
[
  ["Citeringsgrad","Svar där exempelmyndigheten.example finns bland källorna, delat med alla loggade svar."],
  ["Share of Voice (SOV)","Svar som citerar exempelmyndigheten.example, delat med summan av citeringar för de fem domänerna i jämförelsegruppen. Varje domän räknas högst en gång per svar. ”Av alla källor” delar i stället med samtliga unika domäner."],
  ["Placering","Exempelmyndighetens första plats i källistan, räknad från 1. Snittet gäller bara svar där domänen citeras."],
  ["Innehållsanvändning","Svar märkta citat eller parafras, delat med svar där användningen är loggad."],
  ["GEO-poäng","Eget index för Generative Engine Optimization: citeringsgrad 40 %, SOV 20 %, placering (snitt av 1 delat med platsen) 20 % och innehållsanvändning 20 %. Det är inte en branschstandard."],
  ["Osäkerhet","Källorna varierar mellan körningar. Intervallet och bedömningen av förändringar är ungefärliga eftersom upprepade körningar inte är helt oberoende."]
].forEach(([a,b]) => dl.append(el("dt", {}, a), el("dd", {}, b)));
app.append(el("div", {class:"card"}, dl));
app.append(el("p", {class:"note"}, "Källfiler: " + arr(M.filer).join(", ")));

const draw = () => charts.forEach(f => f());
draw();
let timer; addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(draw, 150); });
</script>

(() => {
  const rubriker = [...document.querySelectorAll("#app h2")];
  if (!rubriker.length) return;
  const meny = document.createElement("nav");
  meny.id = "sektioner"; meny.setAttribute("aria-label", "Avsnitt i rapporten");
  rubriker.forEach((h, i) => {
    h.id = "avsnitt-" + (i + 1);
    const a = document.createElement("a");
    a.href = "#" + h.id; a.textContent = h.textContent; meny.append(a);
  });
  document.querySelector("#app .kpis").before(meny);
})();
</script>
